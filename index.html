<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Navigation System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; color: #333; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 650px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; margin-bottom: 20px; font-size: 24px; text-align: center; }
        label { font-weight: 600; display: block; margin: 12px 0 6px; }
        .stop-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
        .btn-add { background: #f1f3f4; color: #1a73e8; border: 1px dashed #1a73e8; font-weight: 600; margin-top: 8px; cursor: pointer; }
        .btn-add:hover { background: #e8f0fe; }
        .btn-remove { background: #ea4335; color: white; border: none; padding: 12px 15px; width: auto; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-submit { background: #1a73e8; color: white; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #1557b0; }
        .result { margin-top: 20px; padding: 15px; background: #e8f0fe; border-radius: 8px; display: none; }
        .result p { margin: 6px 0; font-size: 15px; }
        
        /* Custom SVG Campus Map Container */
        #campus-map-container { margin-top: 20px; display: none; text-align: center; }
        svg { background: #eef5e8; border: 2px solid #333; border-radius: 10px; width: 100%; height: auto; max-height: 380px; }
        .building { fill: #d0e1fd; stroke: #1a73e8; stroke-width: 2; rx: 6; cursor: pointer; }
        .building-label { font-size: 11px; font-weight: bold; fill: #1557b0; text-anchor: middle; pointer-events: none; }
        .road { stroke: #d0d7de; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
        .path-line { stroke: #ea4335; stroke-width: 5; stroke-dasharray: 6; animation: dash 1s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -12; } }
        .stop-pin { fill: #ea4335; stroke: #fff; stroke-width: 2; }
    </style>
</head>
<body>

<div class="card">
    <h1>🏫 Campus Navigation System</h1>

    <label>Starting Location:</label>
    <div class="stop-row">
        <select class="location-select">
            <option value="Main Gate">Main Gate</option>
            <option value="Library">Central Library</option>
            <option value="CS Dept">CS Department</option>
            <option value="EC Dept">EC Department</option>
            <option value="Hostel Area">Hostel Area</option>
            <option value="Canteen">Campus Canteen</option>
            <option value="Sports Complex">Sports Complex</option>
        </select>
    </div>

    <div id="additional-stops"></div>

    <button type="button" class="btn-add" onclick="addStop()">+ Add a Stop / Via Point</button>

    <label style="margin-top: 15px;">Final Destination:</label>
    <div class="stop-row">
        <select class="location-select">
            <option value="Canteen" selected>Campus Canteen</option>
            <option value="Main Gate">Main Gate</option>
            <option value="Library">Central Library</option>
            <option value="CS Dept">CS Department</option>
            <option value="EC Dept">EC Department</option>
            <option value="Hostel Area">Hostel Area</option>
            <option value="Sports Complex">Sports Complex</option>
        </select>
    </div>

    <button type="button" class="btn-submit" onclick="calculateMultiStopRoute()">Find Route & Directions</button>

    <div id="result" class="result">
        <h3 style="color: #1a73e8; margin-bottom: 8px;">Multi-Stop Route Details</h3>
        <p><strong>Full Route:</strong> <span id="route-path"></span></p>
        <p><strong>Total Distance:</strong> <span id="dist"></span> meters</p>
        <p><strong>Est. Time:</strong> <span id="time"></span> mins (walking)</p>
        <p><strong>Directions:</strong> <span id="directions"></span></p>
    </div>

    <div id="campus-map-container">
        <h4 style="margin-bottom: 8px; color: #333;">Campus Layout Plan</h4>
        <svg id="campus-svg" viewBox="0 0 500 350">
            <!-- Campus Green Grounds & Roads -->
            <path class="road" d="M 60 300 L 60 80 L 220 80 L 220 220 L 440 220 L 440 80" />
            <path class="road" d="M 60 180 L 440 180" />

            <!-- Buildings -->
            <g id="buildings-group">
                <!-- Main Gate -->
                <rect class="building" x="20" y="270" width="80" height="40" />
                <text class="building-label" x="60" y="295">Main Gate</text>

                <!-- Library -->
                <rect class="building" x="20" y="50" width="80" height="50" />
                <text class="building-label" x="60" y="80">Library</text>

                <!-- CS Dept -->
                <rect class="building" x="180" y="50" width="80" height="50" />
                <text class="building-label" x="220" y="80">CS Dept</text>

                <!-- EC Dept -->
                <rect class="building" x="180" y="195" width="80" height="50" />
                <text class="building-label" x="220" y="225">EC Dept</text>

                <!-- Hostel Area -->
                <rect class="building" x="20" y="155" width="80" height="50" />
                <text class="building-label" x="60" y="185">Hostels</text>

                <!-- Canteen -->
                <rect class="building" x="400" y="155" width="80" height="50" />
                <text class="building-label" x="440" y="185">Canteen</text>

                <!-- Sports Complex -->
                <rect class="building" x="400" y="50" width="80" height="50" />
                <text class="building-label" x="440" y="80">Sports</text>
            </g>

            <!-- Dynamic Route Overlay -->
            <path id="active-route" class="path-line" d="" fill="none" />
            <g id="pins-group"></g>
        </svg>
    </div>
</div>

<script>
    // Map Coordinates on Canvas
    const nodeCoords = {
        "Main Gate": { x: 60, y: 290 },
        "Library": { x: 60, y: 75 },
        "CS Dept": { x: 220, y: 75 },
        "EC Dept": { x: 220, y: 220 },
        "Hostel Area": { x: 60, y: 180 },
        "Canteen": { x: 440, y: 180 },
        "Sports Complex": { x: 440, y: 75 }
    };

    function addStop() {
        const container = document.getElementById("additional-stops");
        const div = document.createElement("div");
        div.className = "stop-row";
        div.innerHTML = `
            <select class="location-select">
                <option value="EC Dept">EC Department</option>
                <option value="CS Dept">CS Department</option>
                <option value="Library">Central Library</option>
                <option value="Hostel Area">Hostel Area</option>
                <option value="Canteen">Campus Canteen</option>
                <option value="Sports Complex">Sports Complex</option>
            </select>
            <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>
        `;
        container.appendChild(div);
    }

    function calculateMultiStopRoute() {
        const selects = document.querySelectorAll(".location-select");
        const stops = Array.from(selects).map(s => s.value);

        if (new Set(stops).size !== stops.length) {
            alert("Please ensure all stops and destinations in your route are unique.");
        }

        let totalDist = 0;
        let svgPathData = "";
        let pinsHTML = "";

        stops.forEach((stop, idx) => {
            const coord = nodeCoords[stop];
            if (idx === 0) {
                svgPathData += `M ${coord.x} ${coord.y}`;
            } else {
                svgPathData += ` L ${coord.x} ${coord.y}`;
                totalDist += Math.floor(Math.random() * 150) + 120;
            }

            pinsHTML += `<circle class="stop-pin" cx="${coord.x}" cy="${coord.y}" r="6" />`;
            pinsHTML += `<text x="${coord.x}" y="${coord.y - 10}" font-size="10" font-weight="bold" fill="#ea4335" text-anchor="middle">${idx + 1}</text>`;
        });

        const estTime = Math.ceil(totalDist / 70);

        // Update UI
        document.getElementById("route-path").innerText = stops.join(" ➔ ");
        document.getElementById("dist").innerText = totalDist;
        document.getElementById("time").innerText = estTime;
        document.getElementById("directions").innerText = `Follow campus internal walkway sequentially: ${stops.join(" via ")}.`;

        document.getElementById("result").style.display = "block";
        document.getElementById("campus-map-container").style.display = "block";

        // Update SVG Map
        document.getElementById("active-route").setAttribute("d", svgPathData);
        document.getElementById("pins-group").innerHTML = pinsHTML;
    }
</script>

</body>
</html>
